
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CloudMusic Player</title>
<style>
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  padding: 24px 16px;
  background: #11131a;
  color: #ffffff;
  font-family: system-ui, sans-serif;
}
.player {
  max-width: 480px;
  margin: auto;
}
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.version {
  color: #9295a5;
  font-size: 12px;
}
.cover {
  height: 220px;
  margin: 24px 0;
  border-radius: 24px;
  background: linear-gradient(135deg, #3730a3, #9333ea);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 100px;
}
h2 {
  overflow-wrap: anywhere;
}
.subtitle {
  color: #9295a5;
}
button, .import {
  border: none;
  border-radius: 14px;
  padding: 14px;
  background: #292d3b;
  color: white;
  font-size: 16px;
  cursor: pointer;
}
.import {
  display: block;
  text-align: center;
  background: #6366f1;
  margin: 20px 0;
}
input[type="file"] {
  display: none;
}
audio {
  width: 100%;
  margin: 12px 0;
}
.controls {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin: 18px 0;
}
.controls button {
  flex: 1;
}
#playButton {
  background: #6366f1;
}
#playlist {
  padding: 0;
  list-style: none;
}
#playlist li {
  padding: 15px;
  margin: 8px 0;
  background: #20232e;
  border-radius: 12px;
  overflow-wrap: anywhere;
  cursor: pointer;
}
#playlist li.active {
  background: #3730a3;
}
#status {
  color: #b4b7c7;
  font-size: 14px;
}
footer {
  text-align: center;
  color: #777b8c;
  margin-top: 32px;
  font-size: 12px;
}
</style>
</head>
<body>

<main class="player">
  <header>
    <h1>CloudMusic</h1>
    <span class="version">v0.1.0</span>
  </header>

  <div class="cover">♫</div>

  <h2 id="songName">暂无音乐</h2>
  <p class="subtitle">本地音乐播放器</p>

  <label class="import" for="files">
    ＋ 导入本地音乐
  </label>

  <input id="files" type="file"
    accept="audio/*,.mp3,.wav" multiple>

  <audio id="audio" controls></audio>

  <div class="controls">
    <button onclick="previous()">上一曲</button>
    <button id="playButton"
      onclick="togglePlay()">播放</button>
    <button onclick="next()">下一曲</button>
  </div>

  <h3>播放列表</h3>
  <p id="status">尚未导入音乐</p>
  <ul id="playlist"></ul>

  <footer>CloudMusic Player · GitHub Project</footer>
</main>

<script>
const audio = document.getElementById("audio");
const files = document.getElementById("files");
const playlist = document.getElementById("playlist");
const songName = document.getElementById("songName");
const playButton = document.getElementById("playButton");
const status = document.getElementById("status");

let songs = [];
let current = -1;
let currentURL = null;

// 导入本地音乐
files.addEventListener("change", function () {
  const selected = Array.from(files.files);
  songs.push(...selected);
  files.value = "";

  if (current === -1 && songs.length > 0) {
    loadSong(0, false);
  }

  renderPlaylist();
});

// 更新播放列表
function renderPlaylist() {
  playlist.innerHTML = "";
  status.textContent = "共 " + songs.length + " 首音乐";

  songs.forEach((song, index) => {
    const li = document.createElement("li");
    li.textContent = (index + 1) + ". " + song.name;

    if (index === current) {
      li.classList.add("active");
    }

    li.onclick = () => loadSong(index, true);
    playlist.appendChild(li);
  });
}

// 加载歌曲
function loadSong(index, autoplay) {
  if (index < 0 || index >= songs.length) return;

  audio.pause();

  if (currentURL) {
    URL.revokeObjectURL(currentURL);
  }

  current = index;
  currentURL = URL.createObjectURL(songs[index]);
  audio.src = currentURL;
  songName.textContent = songs[index].name;

  renderPlaylist();

  if (autoplay) {
    startPlay();
  }
}

// 开始播放
function startPlay() {
  audio.play().catch(() => {
    status.textContent = "无法播放，请检查音乐格式或文件。";
  });
}

// 播放与暂停
function togglePlay() {
  if (songs.length === 0) {
    alert("请先导入音乐");
    return;
  }

  if (audio.paused) {
    startPlay();
  } else {
    audio.pause();
  }
}

// 上一曲
function previous() {
  if (songs.length === 0) return;
  loadSong((current - 1 + songs.length) % songs.length, true);
}

// 下一曲
function next() {
  if (songs.length === 0) return;
  loadSong((current + 1) % songs.length, true);
}

audio.addEventListener("play", () => {
  playButton.textContent = "暂停";
});

audio.addEventListener("pause", () => {
  playButton.textContent = "播放";
});

audio.addEventListener("ended", () => {
  if (current + 1 < songs.length) {
    loadSong(current + 1, true);
  } else {
    playButton.textContent = "播放";
  }
});

audio.addEventListener("error", () => {
  status.textContent = "当前音乐无法读取或格式不受支持。";
});
</script>

</body>
</html>
