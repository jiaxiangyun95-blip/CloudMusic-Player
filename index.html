
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CloudMusic Player</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#121212;color:white;
 font-family:system-ui,sans-serif;
}
main{max-width:480px;margin:auto;padding:24px}
header{
 display:flex;align-items:center;
 justify-content:space-between;
}
small,.muted{color:#a7a7a7}
.cover{
 aspect-ratio:1;max-width:320px;
 margin:30px auto;
 background:linear-gradient(135deg,#173b30,#427e64);
 border-radius:20px;display:grid;place-items:center;
}
.disc{
 width:82%;aspect-ratio:1;border-radius:50%;
 background:repeating-radial-gradient(
 circle,#151515 0px,#151515 4px,#303030 5px,#151515 7px);
 display:grid;place-items:center;
 animation:spin 15s linear infinite;
 animation-play-state:paused;
}
.disc.playing{animation-play-state:running}
.center{
 width:30%;aspect-ratio:1;border-radius:50%;
 background:#1ed760;display:grid;place-items:center;
 color:#111;font-size:32px;
}
@keyframes spin{to{transform:rotate(360deg)}}
h2{overflow-wrap:anywhere;margin-bottom:5px}
button{
 border:0;background:transparent;color:white;
 cursor:pointer;font-size:22px;padding:12px;
}
button.active{color:#1ed760}
.controls{
 display:flex;align-items:center;
 justify-content:space-between;margin:18px 0;
}
#play{
 width:64px;height:64px;border-radius:50%;
 background:white;color:black;font-size:28px;
}
input[type=range]{
 width:100%;accent-color:#1ed760;
}
.times{
 display:flex;justify-content:space-between;
 font-size:12px;color:#aaa;
}
.import{
 display:block;text-align:center;padding:15px;
 background:#1ed760;color:#101010;
 border-radius:30px;font-weight:bold;margin:20px 0;
}
#files{display:none}
#search{
 width:100%;padding:14px;border:0;
 border-radius:12px;background:#262626;color:white;
 font-size:16px;
}
.row{
 display:flex;align-items:center;gap:10px;
 padding:12px 0;border-bottom:1px solid #292929;
}
.song{
 flex:1;min-width:0;overflow-wrap:anywhere;
 cursor:pointer;
}
.row.current .song{color:#1ed760}
.row button{font-size:18px;padding:8px}
.volume{display:flex;align-items:center;gap:10px}
footer{
 text-align:center;color:#777;
 font-size:12px;margin-top:30px;
}
</style>
</head>
<body>
<main>
<header>
 <strong>CloudMusic</strong>
 <small>v0.2.0</small>
</header>

<div class="cover">
 <div class="disc" id="disc">
  <div class="center">♫</div>
 </div>
</div>

<h2 id="title">暂无音乐</h2>
<p class="muted" id="status">导入音乐，开始聆听</p>

<audio id="audio"></audio>

<input id="progress" type="range"
 min="0" max="100" value="0" step="0.1">

<div class="times">
 <span id="elapsed">0:00</span>
 <span id="duration">0:00</span>
</div>

<div class="controls">
 <button id="shuffle" onclick="toggleShuffle()"
 aria-label="随机播放">⇄</button>
 <button onclick="previous()" aria-label="上一曲">⏮</button>
 <button id="play" onclick="togglePlay()"
 aria-label="播放或暂停">▶</button>
 <button onclick="next()" aria-label="下一曲">⏭</button>
 <button id="repeat" onclick="toggleRepeat()"
 aria-label="循环模式">↻</button>
</div>

<div class="volume">
 <button id="mute" onclick="toggleMute()">🔊</button>
 <input id="volume" type="range"
 min="0" max="1" step="0.01" value="1">
</div>

<label class="import" for="files">
 ＋ 导入本地音乐
</label>
<input id="files" type="file"
 accept="audio/*,.mp3,.wav,.m4a,.flac" multiple>

<h3>我的曲库</h3>
<input id="search" placeholder="搜索歌曲…">
<p class="muted" id="count">共 0 首音乐</p>
<div id="playlist"></div>

<footer>CloudMusic Player · v0.2.0</footer>
</main>

<script>
const $ = id => document.getElementById(id);
const audio = $("audio");
let songs = [];
let current = -1;
let url = null;
let shuffle = false;
let repeat = 0;

$("files").onchange = e => {
 for(const file of e.target.files){
  const exists = songs.some(s =>
   s.file.name === file.name &&
   s.file.size === file.size &&
   s.file.lastModified === file.lastModified);
  if(!exists) songs.push({file,favorite:false});
 }
 e.target.value = "";
 if(current === -1 && songs.length)
  loadSong(0,false);
 render();
};

function render(){
 $("playlist").replaceChildren();
 $("count").textContent = `共 ${songs.length} 首音乐`;
 const keyword = $("search").value.toLowerCase();

 songs.forEach((s,i)=>{
  if(!s.file.name.toLowerCase().includes(keyword)) return;

  const row = document.createElement("div");
  row.className = "row" + (i===current?" current":"");

  const name = document.createElement("div");
  name.className = "song";
  name.textContent = (i===current?"♫ ":"") + s.file.name;
  name.onclick = ()=>loadSong(i,true);

  const heart = document.createElement("button");
  heart.textContent = s.favorite?"♥":"♡";
  heart.className = s.favorite?"active":"";
  heart.onclick = ()=>{
   s.favorite = !s.favorite;
   render();
  };

  const del = document.createElement("button");
  del.textContent = "×";
  del.setAttribute("aria-label","删除歌曲");
  del.onclick = ()=>removeSong(i);

  row.append(name,heart,del);
  $("playlist").append(row);
 });
}

function loadSong(i,autoplay){
 if(i<0 || i>=songs.length) return;
 audio.pause();
 audio.removeAttribute("src");
 audio.load();
 if(url) URL.revokeObjectURL(url);

 current = i;
 url = URL.createObjectURL(songs[i].file);
 audio.src = url;
 $("title").textContent = songs[i].file.name;
 $("status").textContent = "本地音乐";
 $("progress").value = 0;
 $("elapsed").textContent = "0:00";
 $("duration").textContent = "0:00";
 render();
 if(autoplay) startPlay();
}

function startPlay(){
 audio.play().catch(()=>{
  $("status").textContent = "无法播放，请检查文件格式";
 });
}

function togglePlay(){
 if(current===-1){
  alert("请先导入音乐");
  return;
 }
 if(audio.paused) startPlay();
 else audio.pause();
}

function randomIndex(){
 if(songs.length<2) return current;
 let i;
 do{
  i=Math.floor(Math.random()*songs.length);
 }while(i===current);
 return i;
}

function next(){
 if(!songs.length) return;
 loadSong(shuffle?randomIndex():
 (current+1)%songs.length,true);
}

function previous(){
 if(!songs.length) return;
 loadSong((current-1+songs.length)%songs.length,true);
}

function toggleShuffle(){
 shuffle=!shuffle;
 $("shuffle").classList.toggle("active",shuffle);
 $("status").textContent=shuffle?
 "随机播放已开启":"顺序播放";
}

function toggleRepeat(){
 repeat=(repeat+1)%3;
 $("repeat").classList.toggle("active",repeat!==0);
 $("repeat").textContent=repeat===2?"↻¹":"↻";
 $("status").textContent=
 ["关闭循环","列表循环","单曲循环"][repeat];
}

function removeSong(i){
 const wasPlaying=!audio.paused;
 songs.splice(i,1);
 if(i===current){
  audio.pause();
  if(songs.length){
   loadSong(Math.min(i,songs.length-1),wasPlaying);
  }else{
   audio.removeAttribute("src");
   audio.load();
   if(url) URL.revokeObjectURL(url);
   url=null;
   current=-1;
   $("title").textContent="暂无音乐";
   $("status").textContent="导入音乐，开始聆听";
   $("progress").value=0;
   $("elapsed").textContent="0:00";
   $("duration").textContent="0:00";
  }
 }else if(i<current){
  current--;
 }
 render();
}

function formatTime(t){
 if(!Number.isFinite(t)) return "0:00";
 return Math.floor(t/60)+":"+
 String(Math.floor(t%60)).padStart(2,"0");
}

audio.ontimeupdate=()=>{
 if(Number.isFinite(audio.duration)&&audio.duration>0){
  $("progress").value=audio.currentTime/audio.duration*100;
  $("elapsed").textContent=formatTime(audio.currentTime);
 }
};

audio.onloadedmetadata=()=>{
 $("duration").textContent=formatTime(audio.duration);
};

$("progress").oninput=e=>{
 if(Number.isFinite(audio.duration)){
  audio.currentTime=e.target.value/100*audio.duration;
 }
};

$("volume").oninput=e=>{
 audio.volume=Number(e.target.value);
};

function toggleMute(){
 audio.muted=!audio.muted;
 $("mute").textContent=audio.muted?"🔇":"🔊";
}

audio.onplay=()=>{
 $("play").textContent="Ⅱ";
 $("disc").classList.add("playing");
};

audio.onpause=()=>{
 $("play").textContent="▶";
 $("disc").classList.remove("playing");
};

audio.onended=()=>{
 if(repeat===2){
  audio.currentTime=0;
  startPlay();
 }else if(shuffle || repeat===1){
  next();
 }else if(current+1<songs.length){
  loadSong(current+1,true);
 }
};

audio.onerror=()=>{
 if(current!==-1)
  $("status").textContent="音频读取失败或格式不受支持";
};

$("search").oninput=render;
</script>
</body>
</html>
